<!doctype html>
<html><head><meta charset="utf-8"><title>Desktop Widgets</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
<style>
:root{--bg:#f5f5f7;--card:#fff;--fg:#1c1c1e;--sub:#6e6e73;--line:rgba(0,0,0,.1);--blue:#0a84ff}
@media (prefers-color-scheme:dark){:root{--bg:#1e1e20;--card:#2c2c2e;--fg:#f5f5f7;--sub:#a1a1a6;--line:rgba(255,255,255,.12)}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;padding:44px 28px 28px}
h1{font-size:24px;margin:0 0 4px}h2{font-size:15px;margin:28px 0 10px}p{color:var(--sub);margin:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.card{background:var(--card);border:.5px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.card .ic{font-size:34px}select,button{font:inherit;border-radius:8px;border:.5px solid var(--line);padding:6px 10px;background:var(--bg);color:var(--fg)}
button.add{background:var(--blue);color:#fff;border:0;font-weight:600;cursor:pointer}
.act{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:var(--card);border-radius:10px;margin-bottom:6px}
.top{display:flex;justify-content:space-between;align-items:center;gap:16px}label{display:flex;gap:8px;align-items:center}
</style></head><body>
<div class="top"><div><h1>Widget Gallery</h1><p>Add as many widgets as you like. Drag them anywhere on your desktop.</p></div>
<label><input type="checkbox" id="login"> Launch at login</label></div>
<h2>Add a widget</h2><div class="grid" id="gallery"></div>
<h2>On your desktop</h2><div id="active"></div>
<script src="widgets.js"></script><script src="manager.js"></script></body></html>
